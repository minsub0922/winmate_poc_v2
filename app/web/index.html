<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Winmate v2</title><meta name="description" content="고객 요구사항에서 Storyboard, PPT 레이아웃 선정과 채우기, PPTX 내보내기까지">

<link rel="stylesheet" href="/fonts/fonts.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body><div id="root"><div id="wm-startup" role="status" aria-live="polite" style="min-height:100vh;display:grid;place-content:center;gap:12px;padding:24px;box-sizing:border-box;text-align:center"><b style="font-size:20px">Winmate를 준비하고 있어요</b><span id="wm-startup-message">제안서 작업 공간과 레이아웃을 불러오는 중입니다.</span><button id="wm-startup-retry" type="button" hidden style="justify-self:center;padding:10px 18px;cursor:pointer">다시 시도</button></div></div>
<noscript>Winmate를 사용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
<script>
(function () {
  function status(message) {
    var el = document.getElementById('wm-startup-message');
    if (!el) return;
    el.textContent = message;
    document.getElementById('wm-startup-retry').hidden = false;
  }
  document.getElementById('wm-startup-retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('error', function (event) {
    if (event.target && event.target.tagName === 'SCRIPT') status('앱 파일을 불러오지 못했어요. 연결을 확인하고 다시 시도해 주세요.');
    else if (event.message) status('앱을 시작하지 못했어요. 다시 시도해 주세요.');
  }, true);
  window.addEventListener('unhandledrejection', function () { status('앱을 시작하지 못했어요. 다시 시도해 주세요.'); });
  setTimeout(function () { status('첫 접속은 파일을 내려받는 데 시간이 걸릴 수 있어요. 계속 기다리거나 다시 시도해 주세요.'); }, 20000);
})();
</script>
<!-- layout-data --><script type="module" src="/src/main.jsx"></script></body></html>
