<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winmate · 로그인 관리</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/tokens.css"><style>body{font-family:var(--sans);background:var(--auth-color-14);color:var(--auth-color-15);margin:0;display:grid;place-items:center;min-height:100vh}main{background:white;border:var(--measure-1px) solid var(--auth-color-16);border-radius:var(--radius-16px);padding:var(--space-32px);width:min(var(--measure-360px),calc(100vw - var(--measure-80px)))}h1{font-size:var(--text-22px)}p{color:var(--auth-color-17);font-size:var(--text-14px);line-height:1.7}button,a{font:inherit}button{border:0;background:var(--color-1428a0);color:white;border-radius:var(--radius-9px);padding:var(--space-10px) var(--space-16px);cursor:pointer}a{margin-left:var(--space-16px);color:var(--color-1428a0)}#status{min-height:var(--measure-24px)}</style>
<main><h1>로그인 관리</h1><p id="who"></p><p>이 브라우저의 로그인 세션을 종료합니다. 제안서와 My 템플릿은 사용자별로 유지됩니다.</p><button id="logout">로그아웃</button><a href="/">앱으로 돌아가기</a><section id="password-panel" hidden style="border-top:1px solid #e4e9ed;margin-top:26px;padding-top:20px"><h2 style="font-size:17px">비밀번호 변경</h2><form id="password-form"><label style="display:block;font-size:13px;margin:13px 0">현재 비밀번호<input name="current_password" type="password" autocomplete="current-password" required maxlength="1024" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:10px;border:1px solid #dae3e8;border-radius:7px"></label><label style="display:block;font-size:13px;margin:13px 0">새 비밀번호<input name="new_password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024" placeholder="12자 이상" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:10px;border:1px solid #dae3e8;border-radius:7px"></label><label style="display:block;font-size:13px;margin:13px 0">새 비밀번호 확인<input name="confirm_password" type="password" autocomplete="new-password" required minlength="12" maxlength="1024" style="display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:10px;border:1px solid #dae3e8;border-radius:7px"></label><button type="submit">비밀번호 변경</button></form></section><p id="status" role="status"></p></main>
<script>
const trace=crypto.randomUUID().replaceAll('-','');
const log=(kind,action)=>fetch('/api/activity/events',{method:'POST',headers:{'Content-Type':'application/json','X-Winmate-Trace':trace},body:JSON.stringify({events:[{id:crypto.randomUUID(),kind,action,page:'account',feature:'account',trace_id:trace,at:Date.now()/1000}]})}).catch(()=>{});
fetch('/api/auth/status').then(r=>r.json()).then(s=>{if(s.user){document.querySelector('#who').textContent=s.user.username;document.querySelector('#password-panel').hidden=false;void log('screen.enter','enter');}}).catch(()=>{});
document.querySelector('#logout').addEventListener('click',async()=>{const button=document.querySelector('#logout');button.disabled=true;try{const r=await fetch('/api/auth/logout',{method:'POST',headers:{'X-Winmate-Trace':trace}});if(!r.ok)throw new Error('로그아웃하지 못했습니다.');location.replace('/');}catch(e){document.querySelector('#status').textContent=e.message;button.disabled=false;}});
document.querySelector('#password-form').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button');if(form.new_password.value!==form.confirm_password.value){document.querySelector('#status').textContent='새 비밀번호 확인이 일치하지 않습니다.';return;}button.disabled=true;try{const response=await fetch('/api/activity/password',{method:'POST',headers:{'Content-Type':'application/json','X-Winmate-Trace':trace},body:JSON.stringify({current_password:form.current_password.value,new_password:form.new_password.value})});const body=await response.json();if(!response.ok)throw new Error(body.detail || '변경하지 못했습니다.');form.reset();location.replace('/login.html?next=%2F');}catch(error){document.querySelector('#status').textContent=error.message;button.disabled=false;}});
</script></html>
